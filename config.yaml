# AI Review Insight Analyzer Configuration

# LLM Provider settings:
# Supported providers: "gemini" (Google Gemini Free Tier), "groq" (Groq Cloud Free Tier), "openai" (OpenAI)
# Default is set to "gemini" which provides a generous free API tier without requiring credit cards.
provider:
  name: "gemini"
  # Default model: models/gemini-3.8-flash (fast, accurate structured JSON outputs, active free tier)
  # Alternative models:
  # For Groq: "llama-3.3-70b-versatile", "llama-3.1-8b-instant"
  # For OpenAI: "gpt-4o-mini", "gpt-4o"
  model: "models/gemini-3.8-flash"
  # Optional custom base URL (null for official SDKs)
  base_url: null
  # Environment variable for the API key
  api_key_env_var: "GEMINI_API_KEY"

# Model generation parameters
generation:
  temperature: 0.1
  max_tokens: 3000

# Batch processing and guardrail settings
processing:
  # Reviews sent per API request to reduce latency and stay within token windows
  batch_size: 5
  # Upper limit on number of reviews analyzed in one session
  max_reviews: 100
  # Maximum characters allowed per individual review
  max_review_chars: 2000
  # Request timeout in seconds
  timeout_seconds: 60
  # Number of retry attempts on transient network or rate-limit errors
  retry_limit: 2
